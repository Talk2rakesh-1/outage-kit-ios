name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test
      - run: xcrun swift-format lint --strict -r App Sources Tests Package.swift
      - name: Build native iOS app without signing
        run: xcodebuild -project OutageKit.xcodeproj -scheme OutageKit -sdk iphonesimulator -configuration Release -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
